[package]
name = "vesper-chess"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first, peer-to-peer chess game for the terminal"
license = "MIT"
default-run = "vesper"

[[bin]]
name = "vesper"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
shakmaty = "0.30"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"

[lints.rust]
unsafe_code = "forbid"
